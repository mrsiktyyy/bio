        /* ===== все стили идентичны основному составу ===== */
        * {

            padding: 0;
            box-sizing: border-box;
        }
        body {
            font-family: 'Roboto', sans-serif;
            background: #121212;
            color: #ffffff;
            line-height: 1.5;
            overflow-x: hidden;
            display: flex;
            flex-direction: column;

            background: transparent;
        }

        .light-source {
            position: fixed;
            width: 600px;
            height: 600px;
            border-radius: 50%;
            pointer-events: none;
            z-index: 0;
            opacity: 0.08;
            filter: blur(80px);
            animation: floatLight 22s infinite alternate ease-in-out;
        }
        .light-source-1 {
            background: radial-gradient(circle, #FF5500, transparent);
            top: -10%;
            left: -10%;
        }
        .light-source-2 {
            background: radial-gradient(circle, #FF5500, transparent);
            bottom: -10%;
            right: -10%;
            animation-duration: 26s;
            animation-delay: -4s;
        }
        @keyframes floatLight {
            0% {
                transform: translate(0, 0) scale(1);
                opacity: 0.05;
            }
            100% {
                transform: translate(10%, 15%) scale(1.3);
                opacity: 0.12;
            }
        }

        .cursor-glow {
            position: fixed;
            width: 300px;
            height: 300px;
            background: radial-gradient(circle, rgba(255, 85, 0, 0.15), transparent 70%);
            border-radius: 50%;
            pointer-events: none;
            transform: translate(-50%, -50%);
            filter: blur(40px);
            z-index: 1000;
            transition: none;
        }

        .sidebar {
            position: fixed;
            top: 0;
            left: 0;
            width: 280px;
            height: 100vh;
            background: #1a1a1d;
            padding: 24px 16px;
            display: flex;
            flex-direction: column;
            gap: 20px;
            z-index: 100;
            border-right: 1px solid #2a2a2d;
            transition: transform 0.3s ease;
        }
        .sidebar .logo-link {
            display: block;
            width: 100%;
            margin-bottom: 8px;
            border-bottom: 1px solid #2a2a2d;
            padding-bottom: 12px;
        }
        .sidebar .logo-link img {
            width: 100%;
            height: auto;
            max-height: 100px;
            object-fit: contain;
            display: block;
        }
        .sidebar nav ul {
            list-style: none;
            display: flex;
            flex-direction: column;
            gap: 4px;
        }
        .sidebar nav ul li a {
            display: flex;
            align-items: center;
            gap: 16px;
            padding: 12px 16px;
            border-radius: 8px;
            color: #aaaaaa;
            text-decoration: none;
            font-weight: 500;
            font-size: 0.95rem;
            transition: all 0.2s;
        }
        .sidebar nav ul li a i {
            width: 24px;
            text-align: center;
            font-size: 1.2rem;
        }
        .sidebar nav ul li a:hover {
            background: rgba(255, 255, 255, 0.05);
            color: #ffffff;
        }
        .sidebar nav ul li a.active {
            background: #FF5500;
            color: #ffffff;

        }

            z-index: 1;

            align-items: center;
            justify-content: space-between;
            padding: 20px 0;
            border-bottom: 1px solid #2a2a2d;
            margin-bottom: 30px;
            flex-wrap: wrap;
            gap: 16px;
        }
        .top-bar .hamburger {
            display: none;
            font-size: 1.6rem;
            color: #aaaaaa;
            cursor: pointer;
            background: none;
            border: none;
            padding: 4px;
        }
        .top-bar .hamburger:hover {
            color: #ffffff;
        }
        .top-bar .page-title {
            font-size: 1.6rem;
            font-weight: 700;
            color: #ffffff;
        }
        .top-bar .page-title span {
            color: #FF5500;
        }
        .top-bar .right-actions {
            display: flex;
            align-items: center;
            gap: 16px;
        }
        .top-bar .right-actions a {
            display: flex;
            align-items: center;
            gap: 8px;
            padding: 8px 16px;
            border-radius: 40px;

            height: 100%;

        .member-tag {

            color: #aaaaaa;
            margin-bottom: 16px;
            letter-spacing: 0.3px;
        }

        .stats-grid {
            display: grid;
            grid-template-columns: repeat(3, 1fr);
            gap: 12px;
            margin-bottom: 18px;
        }
        .stat-tile {
            background: rgba(255, 255, 255, 0.04);
            border-radius: 8px;
            padding: 10px 6px;
            text-align: center;
            border: 1px solid #2a2a2d;

        .stat-tile:hover {

            border-radius: 20px;
            overflow: hidden;
            position: relative;
            animation: modalFade 0.3s ease;
            box-shadow: 0 25px 50px -12px rgba(0, 0, 0, 0.8);

        .modal-background {

            top: 0;
            left: 0;
            width: 100%;
            height: 100%;

        .profile-avatar img {

            height: 100%;

            right: 20px;

            z-index: 20;
            line-height: 1;
            pointer-events: auto;

        .profile-stats .label {
            color: #999999;

        .profile-stats .value {
            text-align: right;
            color: #ffffff;
            font-weight: 600;
        }
        .profile-stats .value.accent {
            color: #FF5500;
        }
        .profile-stats .value.italic-num {
            font-style: italic;
        }
        .profile-stats .value .elo-orange {
            color: #FF5500;
        }
        .profile-stats .value.elo-white {
            color: #ffffff;
            font-weight: 700;
        }
        .profile-stats .value .faceit-icon {
            display: inline-block;
            width: 36px;
            height: 36px;
            vertical-align: middle;
        }
        .profile-stats .value .faceit-icon img {
            width: 100%;
            height: 100%;
            display: block;
        }

        .profile-steam-btn {
            display: block;
            margin: 0 24px 24px;
            padding: 12px 20px;
            background: rgba(42, 42, 45, 0.8);
            backdrop-filter: blur(4px);
            border-radius: 40px;
            color: #aaaaaa;
            text-decoration: none;
            transition: 0.3s;
            font-weight: 500;
            font-size: 0.95rem;
            text-align: center;
        }
        .profile-steam-btn:hover {
            background: rgba(60, 60, 65, 0.9);
            color: #ffffff;
        }

        @keyframes modalFade {
            from {
                opacity: 0;
                transform: scale(0.95) translateY(20px);
            }
            to {
                opacity: 1;
                transform: scale(1) translateY(0);
            }
        }

        footer {
            text-align: center;
            padding: 20px 0 10px;
            border-top: 1px solid #2a2a2d;
            margin-top: 20px;
            color: #666666;
            font-size: 0.8rem;
            width: 100%;
            margin-left: 280px;
            background: #121212;
        }

        @media (max-width: 992px) {
            .sidebar {
                transform: translateX(-100%);

            .sidebar.open {
                transform: translateX(0);
            }
            .main {
                margin-left: 0;
                padding: 0 20px 20px;

            footer {
                margin-left: 0;
            }
            .top-bar .hamburger {
                display: block;
            }
            .team-grid {
                grid-template-columns: repeat(auto-fill, minmax(240px, 1fr));

        }
        @media (max-width: 600px) {
            .team-grid {
                grid-template-columns: 1fr;
            }
            .modal-content {
                max-width: 100%;
            }
            .profile-stats {
                grid-template-columns: 1fr;
                gap: 8px 0;
                padding: 16px;
            }
            .profile-stats .value {

            .top-bar .right-actions a span {

                height: 80px;

                font-size: 1.6rem;

        }

        .fade-up {
            opacity: 0;
            transform: translateY(20px);

        }
        @keyframes fadeUp {
            to {
                opacity: 1;
                transform: translateY(0);

        }
        .delay-1 {
            animation-delay: 0.05s;
        }
        .delay-2 {
            animation-delay: 0.1s;
        }
        .delay-3 {
            animation-delay: 0.15s;
        }
        .delay-4 {
            animation-delay: 0.2s;
        }
        .delay-5 {
            animation-delay: 0.25s;
        }
    </style>
</head>

        // ── Форматирование ──
        function formatNumberWithElo(num) {
            if (num === '—' || num === undefined) return '—';
            let str = String(num);
            let suffix = '';
            if (str.includes('elo')) {
                suffix = ' elo';
                str = str.replace(' elo', '').trim();
            }
            let number = parseFloat(str);
            if (isNaN(number)) return str + suffix;
            let formatted = number.toString().replace(/\B(?=(\d{3})+(?!\d))/g, ",");
            if (suffix) {
                return formatted + ' <span class="elo-orange">elo</span>';
            }
            return formatted;

            }
        ];

        // ── Рендер ──
        const grid = document.getElementById('teamGrid');
        grid.innerHTML = '';

        players.forEach((p, index) => {
            const card = document.createElement('div');
            card.className = `member-card fade-up delay-${(index % 5) + 1}`;

            const cardTop = document.createElement('div');
            cardTop.className = 'card-top';
            cardTop.style.backgroundImage = `url('${p.banner}')`;
            cardTop.style.backgroundSize = 'cover';
            cardTop.style.backgroundPosition = 'center';
            cardTop.style.backgroundRepeat = 'no-repeat';

            const avatarDiv = document.createElement('div');
            avatarDiv.className = 'member-avatar';
            const img = document.createElement('img');
            img.src = p.avatar;
            img.alt = p.name;
            img.onerror = function() { this.style.display = 'none';
                this.parentElement.textContent = p.name.charAt(0); };
            avatarDiv.appendChild(img);
            cardTop.appendChild(avatarDiv);

            const cardBody = document.createElement('div');
            cardBody.className = 'card-body';

            const nameDiv = document.createElement('div');
            nameDiv.className = 'member-name';
            nameDiv.textContent = p.name;

            const tagDiv = document.createElement('div');
            tagDiv.className = 'member-tag';
            tagDiv.textContent = p.tag;

            const statsGrid = document.createElement('div');
            statsGrid.className = 'stats-grid';

            const s = p.stats;
            const kdClass = 'value accent';
            const kdTile = createStatTile('K/D', s.kd, kdClass);
            statsGrid.appendChild(kdTile);

            const wrTile = document.createElement('div');
            wrTile.className = 'stat-tile';
            wrTile.innerHTML = `<span class="label">Win Rate</span><div class="value accent">${s.winrate}%</div><div class="progress-wrap"><div class="progress-fill" style="width:${s.winrate}%"></div></div>`;
            statsGrid.appendChild(wrTile);

            const hsTile = document.createElement('div');
            hsTile.className = 'stat-tile';
            hsTile.innerHTML = `<span class="label">HS%</span><div class="value accent">${s.hs}%</div><div class="progress-wrap"><div class="progress-fill" style="width:${s.hs}%"></div></div>`;
            statsGrid.appendChild(hsTile);

            const adrTile = document.createElement('div');
            adrTile.className = 'stat-tile';
            adrTile.title = 'Средний урон за раунд';
            adrTile.innerHTML = `<span class="label">ADR</span><div class="value italic-num">${formatNumberWithElo(s.adr)}</div>`;
            statsGrid.appendChild(adrTile);

            const s4Tile = document.createElement('div');
            s4Tile.className = 'stat-tile';
            s4Tile.innerHTML = `<span class="label">Season 4</span><div class="value elo-white">${formatNumberWithElo(s.season4)}</div>`;
            statsGrid.appendChild(s4Tile);

            const faceitTile = document.createElement('div');
            faceitTile.className = 'stat-tile';
            const lvl = s.faceit_lvl || 0;
            const iconPath = `/phx/faceit${lvl}.svg`;
            faceitTile.innerHTML = `
                <span class="label">LVL FACEIT</span>
                <div class="value">
                    <span class="faceit-icon">
                        <img src="${iconPath}" alt="LVL ${lvl}" style="width:36px;height:36px;display:block;" onerror="this.style.display='none';this.parentElement.innerHTML='${lvl}'">
                    </span>
                </div>
            `;
            statsGrid.appendChild(faceitTile);

            const btn = document.createElement('a');
            btn.className = 'btn-steam';
            btn.href = p.steam;
            btn.target = '_blank';
            btn.innerHTML = '<i class="fab fa-steam"></i> Профиль Steam';

            cardBody.appendChild(nameDiv);
            cardBody.appendChild(tagDiv);
            cardBody.appendChild(statsGrid);
            cardBody.appendChild(btn);

            card.appendChild(cardTop);
            card.appendChild(cardBody);

            card.addEventListener('click', (e) => {
                if (e.target.closest('.btn-steam')) return;
                openModal(p.id);
            });

            grid.appendChild(card);
        });

        function createStatTile(label, value, valueClass) {
            const tile = document.createElement('div');
            tile.className = 'stat-tile';
            const formatted = (label === 'K/D' || label === 'Win Rate' || label === 'HS%') ? value : formatNumberWithElo(value);
            tile.innerHTML = `<span class="label">${label}</span><div class="${valueClass}">${formatted}</div>`;
            return tile;
        }

        // ── Модалка ──
        const overlay = document.getElementById('modalOverlay');
        const closeBtn = document.getElementById('modalClose');
        const modalBackground = document.getElementById('modalBackground');
        const profileBannerImg = document.getElementById('profileBannerImg');
        const profileAvatar = document.getElementById('profileAvatar').querySelector('img');
        const profileName = document.getElementById('profileName');
        const profileTag = document.getElementById('profileTag');
        const profileStats = document.getElementById('profileStats');
        const profileSteam = document.getElementById('profileSteam');

        function openModal(id) {
            const player = players.find(p => p.id === id);
            if (!player) return;
            modalBackground.style.backgroundImage = `url('${player.banner}')`;
            profileBannerImg.src = player.banner;
            profileAvatar.src = player.avatar;
            profileAvatar.alt = player.name;
            profileName.textContent = player.name;
            profileTag.textContent = player.tag;

            const s = player.stats;
            const lvl = s.faceit_lvl || 0;
            const iconPath = `/phx/faceit${lvl}.svg`;
            profileStats.innerHTML = `
                <span class="label">K/D</span><span class="value accent">${s.kd}</span>
                <span class="label">Win Rate</span><span class="value">${s.winrate}%</span>
                <span class="label">HS %</span><span class="value accent">${s.hs}%</span>
                <span class="label">ADR</span><span class="value italic-num">${formatNumberWithElo(s.adr)}</span>
                <span class="label">Season 1</span><span class="value elo-white">${formatNumberWithElo(s.season1)}</span>
                <span class="label">Season 2</span><span class="value elo-white">${formatNumberWithElo(s.season2)}</span>
                <span class="label">Season 3</span><span class="value elo-white">${formatNumberWithElo(s.season3)}</span>
                <span class="label">Season 4</span><span class="value elo-white">${formatNumberWithElo(s.season4)}</span>
                <span class="label">LVL FACEIT</span>
                <span class="value">
                    <span class="faceit-icon">
                        <img src="${iconPath}" alt="LVL ${lvl}" style="width:36px;height:36px;display:block;" onerror="this.style.display='none';this.parentElement.innerHTML='${lvl}'">
                    </span>
                </span>
            `;
            profileSteam.href = player.steam;
            overlay.classList.add('active');
            document.body.style.overflow = 'hidden';
        }

        function closeModal() {
            overlay.classList.remove('active');
            document.body.style.overflow = '';
        }
        closeBtn.addEventListener('click', closeModal);
        overlay.addEventListener('click', (e) => { if (e.target === overlay) closeModal(); });
        document.addEventListener('keydown', (e) => { if (e.key === 'Escape') closeModal(); });

        // ── Гамбургер ──
        const hamburger = document.getElementById('hamburgerBtn');
        const sidebar = document.getElementById('sidebar');
        hamburger.addEventListener('click', () => sidebar.classList.toggle('open'));
        document.addEventListener('click', (e) => {
            if (window.innerWidth <= 992) {
                if (!sidebar.contains(e.target) && e.target !== hamburger && !hamburger.contains(e.target)) {
                    sidebar.classList.remove('open');
                }
            }
        });

        // ── Курсор ──
        const glow = document.getElementById('cursorGlow');
        let mx = 0, my = 0, gx = 0, gy = 0;
        document.addEventListener('mousemove', (e) => { mx = e.clientX; my = e.clientY; });
        function animateGlow() {
            gx += (mx - gx) * 0.12;
            gy += (my - gy) * 0.12;
            glow.style.left = gx + 'px';
            glow.style.top = gy + 'px';
            requestAnimationFrame(animateGlow);
        }
        animateGlow();
    </script>
</body>
</html>
