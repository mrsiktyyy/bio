<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=yes" />
    <title>Phoenix Team | CS2</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Inter:opsz,wght@14..32,300;400;500;600;700;800&family=Orbitron:wght@400;700;900&family=Roboto+Mono:wght@400;600&display=swap" rel="stylesheet" />
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0-beta3/css/all.min.css" />
    <link rel="icon" type="image/png" href="/favicon2.png" />
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        body {
            background: #0b0e1a;
            font-family: 'Inter', sans-serif;
            color: #eaeef7;
            line-height: 1.6;
            overflow-x: hidden;
        }
        body::-webkit-scrollbar {
            width: 0;
            background: transparent;
        }
        body {
            scrollbar-width: none;
        }
        body::before {
            content: "";
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            pointer-events: none;
            z-index: 999;
            box-shadow: inset 0 0 150px rgba(0, 0, 0, 0.7), inset 0 0 40px rgba(255, 100, 100, 0.1);
        }
        body::after {
            content: "";
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: url('11.png') no-repeat center center;
            background-size: cover;
            opacity: 0.06;
            pointer-events: none;
            z-index: 0;
            transform: scaleY(-1);
        }
        .light-source-1,
        .light-source-2 {
            position: fixed;
            width: 600px;
            height: 600px;
            border-radius: 50%;
            pointer-events: none;
            z-index: 1;
            opacity: 0.2;
            filter: blur(80px);
            animation: floatLight 22s infinite alternate ease-in-out;
        }
        .light-source-1 {
            background: radial-gradient(circle, rgba(255, 70, 70, 0.3), rgba(255, 150, 50, 0));
            top: -10%;
            left: -10%;
        }
        .light-source-2 {
            background: radial-gradient(circle, rgba(255, 100, 100, 0.25), rgba(255, 180, 80, 0));
            bottom: -5%;
            right: -15%;
            animation-duration: 26s;
            animation-delay: -4s;
        }
        @keyframes floatLight {
            0% {
                transform: translate(0, 0) scale(1);
                opacity: 0.15;
            }
            100% {
                transform: translate(10%, 15%) scale(1.3);
                opacity: 0.3;
            }
        }
        .cursor-glow {
            position: fixed;
            width: 350px;
            height: 350px;
            background: radial-gradient(circle, rgba(255, 100, 100, 0.2) 0%, rgba(255, 150, 50, 0.05) 50%, transparent 75%);
            border-radius: 50%;
            pointer-events: none;
            transform: translate(-50%, -50%);
            filter: blur(35px);
            z-index: 1000;
        }
        .container {
            max-width: 1440px;
            margin: 0 auto;
            padding: 0 30px;
            position: relative;
            z-index: 10;
        }
        .navbar {
            padding: 25px 0 20px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            flex-wrap: wrap;
            gap: 20px;
            border-bottom: 1px solid rgba(255, 100, 100, 0.15);
            margin-bottom: 30px;
        }
        .logo {
            font-size: 2.2rem;
            font-weight: 900;
            font-family: 'Orbitron', sans-serif;
            background: linear-gradient(135deg, #ff6b6b, #ffa94d);
            background-clip: text;
            -webkit-background-clip: text;
            color: transparent;
            letter-spacing: -0.5px;
            animation: logoGlow 3s infinite alternate;
        }
        @keyframes logoGlow {
            0% {
                text-shadow: 0 0 5px rgba(255, 100, 100, 0.2);
            }
            100% {
                text-shadow: 0 0 25px rgba(255, 100, 100, 0.5);
            }
        }
        .nav-links {
            display: flex;
            gap: 2.2rem;
            flex-wrap: wrap;
        }
        .nav-links a {
            text-decoration: none;
            color: #c0b0d0;
            font-weight: 500;
            transition: all 0.3s cubic-bezier(0.2, 0.9, 0.4, 1.1);
            position: relative;
            font-size: 0.95rem;
        }
        .nav-links a::after {
            content: '';
            position: absolute;
            bottom: -4px;
            left: 0;
            width: 0;
            height: 2px;
            background: linear-gradient(90deg, #ff6b6b, #ffa94d);
            transition: width 0.3s ease;
        }
        .nav-links a:hover::after {
            width: 100%;
        }
        .nav-links a:hover {
            color: #ffd0a0;
        }
        .nav-links a.active {
            color: #ffa94d;
            text-shadow: 0 0 15px rgba(255, 150, 50, 0.4);
        }
        .nav-links a.active::after {
            width: 100%;
        }

        .page-header {
            text-align: center;
            margin-bottom: 48px;
        }
        .page-header h1 {
            font-size: 3rem;
            font-family: 'Orbitron', sans-serif;
            background: linear-gradient(135deg, #ff6b6b, #ffa94d);
            background-clip: text;
            -webkit-background-clip: text;
            color: transparent;
            margin-bottom: 6px;
            letter-spacing: 2px;
        }
        .page-header p {
            color: #b0a0c0;
            font-size: 1.1rem;
        }

        /* ── Сетка 5 колонок ── */
        .team-grid {
            display: grid;
            grid-template-columns: repeat(5, 1fr);
            gap: 24px;
            margin: 40px 0;
        }

        /* ── Карточка ── */
        .member-card {
            background: rgba(16, 12, 30, 0.7);
            backdrop-filter: blur(12px);
            border-radius: 28px;
            border: 1px solid rgba(255, 100, 100, 0.15);
            padding: 22px 16px 20px;
            text-align: center;
            transition: all 0.4s cubic-bezier(0.2, 0.9, 0.4, 1.1);
            cursor: pointer;
            position: relative;
            overflow: hidden;
            will-change: transform;
        }
        .member-card::before {
            content: '';
            position: absolute;
            top: -50%;
            left: -50%;
            width: 200%;
            height: 200%;
            background: radial-gradient(circle at 30% 30%, rgba(255, 100, 100, 0.08), transparent 70%);
            transition: all 0.5s;
            pointer-events: none;
        }
        /* Анимация шатания при наведении */
        @keyframes sway {
            0% {
                transform: rotate(-1.2deg) scale(1.02);
            }
            50% {
                transform: rotate(1.2deg) scale(1.02);
            }
            100% {
                transform: rotate(-1.2deg) scale(1.02);
            }
        }
        .member-card:hover {
            border-color: #ffa94d;
            box-shadow: 0 20px 40px rgba(255, 100, 100, 0.3);
            animation: sway 0.8s ease-in-out infinite;
        }
        .member-card:hover::before {
            transform: scale(1.2);
            opacity: 0.6;
        }
        .member-avatar {
            width: 100px;
            height: 100px;
            border-radius: 50%;
            margin: 0 auto 14px;
            overflow: hidden;
            border: 2px solid rgba(255, 100, 100, 0.3);
            box-shadow: 0 0 25px rgba(255, 100, 100, 0.2);
            transition: transform 0.3s;
        }
        .member-card:hover .member-avatar {
            transform: scale(1.05) rotate(2deg);
        }
        .member-avatar img {
            width: 100%;
            height: 100%;
            object-fit: cover;
            display: block;
        }
        .member-name {
            font-size: 1.3rem;
            font-weight: 700;
            font-family: 'Orbitron', sans-serif;
            color: #fff;
            margin-bottom: 2px;
        }
        .member-role {
            display: inline-block;
            background: rgba(255, 100, 100, 0.15);
            padding: 2px 14px;
            border-radius: 40px;
            font-size: 0.65rem;
            font-weight: 600;
            color: #ffa94d;
            border: 1px solid rgba(255, 100, 100, 0.15);
            text-transform: uppercase;
            letter-spacing: 0.5px;
            margin-bottom: 10px;
        }
        .member-stats {
            display: flex;
            justify-content: center;
            gap: 12px;
            font-size: 0.75rem;
            color: #b0a0c0;
            font-family: 'Roboto Mono', monospace;
            margin-bottom: 12px;
        }
        .member-stats span {
            background: rgba(0, 0, 0, 0.3);
            padding: 2px 10px;
            border-radius: 16px;
            border: 1px solid rgba(255, 255, 255, 0.05);
        }
        .member-stats .highlight {
            color: #ffa94d;
            font-weight: 600;
        }
        .member-actions {
            display: flex;
            justify-content: center;
            gap: 10px;
            flex-wrap: wrap;
            margin-top: 6px;
        }
        .btn-detail,
        .btn-steam {
            display: inline-flex;
            align-items: center;
            gap: 6px;
            padding: 6px 16px;
            border-radius: 40px;
            font-size: 0.75rem;
            font-weight: 600;
            text-decoration: none;
            transition: all 0.3s;
            border: 1px solid rgba(255, 255, 255, 0.08);
            background: rgba(255, 255, 255, 0.04);
            color: #c0b0d0;
            cursor: pointer;
        }
        .btn-detail:hover,
        .btn-steam:hover {
            background: rgba(255, 100, 100, 0.15);
            border-color: #ffa94d;
            color: #fff;
            transform: translateY(-2px);
        }
        .btn-steam {
            color: #7aa8d0;
        }
        .btn-steam:hover {
            color: #fff;
            background: rgba(100, 150, 255, 0.15);
            border-color: #7aa8d0;
        }

        /* ── Карточка-вакансия ── */
        .vacancy {
            border-style: dashed;
            border-color: rgba(255, 200, 100, 0.3);
            background: rgba(16, 12, 30, 0.3);
            cursor: default;
        }
        .vacancy:hover {
            animation: none;
            border-color: #ffa94d;
            box-shadow: 0 20px 40px rgba(255, 100, 100, 0.15);
        }
        .vacancy .member-avatar {
            background: rgba(255, 200, 100, 0.1);
            border: 2px dashed #ffa94d;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 2.8rem;
            color: #ffa94d;
        }
        .vacancy .member-avatar img {
            display: none;
        }
        .vacancy .member-name {
            color: #ffa94d;
        }
        .vacancy .member-role {
            background: rgba(255, 200, 100, 0.1);
            color: #ffcc80;
        }
        .vacancy .member-bio {
            color: #a090b0;
            font-size: 0.9rem;
            margin-bottom: 12px;
        }
        .vacancy .btn-detail {
            background: rgba(255, 200, 100, 0.1);
            border-color: #ffa94d;
            color: #ffa94d;
        }
        .vacancy .btn-detail:hover {
            background: #ffa94d;
            color: #0b0e1a;
        }

        /* ── Модальное окно ── */
        .modal-overlay {
            display: none;
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(0, 0, 0, 0.8);
            backdrop-filter: blur(10px);
            z-index: 2000;
            justify-content: center;
            align-items: center;
            padding: 20px;
        }
        .modal-overlay.active {
            display: flex;
        }
        .modal-box {
            background: rgba(16, 12, 30, 0.95);
            border-radius: 36px;
            border: 1px solid rgba(255, 100, 100, 0.3);
            max-width: 520px;
            width: 100%;
            padding: 32px 28px;
            position: relative;
            animation: modalFade 0.3s ease;
            max-height: 90vh;
            overflow-y: auto;
        }
        @keyframes modalFade {
            from {
                opacity: 0;
                transform: scale(0.95) translateY(20px);
            }
            to {
                opacity: 1;
                transform: scale(1) translateY(0);
            }
        }
        .modal-close {
            position: absolute;
            top: 16px;
            right: 22px;
            font-size: 28px;
            color: #a090b0;
            cursor: pointer;
            transition: 0.2s;
            line-height: 1;
        }
        .modal-close:hover {
            color: #fff;
            transform: rotate(90deg);
        }
        .modal-avatar {
            width: 100px;
            height: 100px;
            border-radius: 50%;
            overflow: hidden;
            margin: 0 auto 16px;
            border: 2px solid #ffa94d;
            box-shadow: 0 0 30px rgba(255, 100, 100, 0.3);
        }
        .modal-avatar img {
            width: 100%;
            height: 100%;
            object-fit: cover;
        }
        .modal-name {
            font-size: 2rem;
            font-family: 'Orbitron', sans-serif;
            text-align: center;
            color: #fff;
            margin-bottom: 4px;
        }
        .modal-role {
            text-align: center;
            color: #ffa94d;
            font-size: 0.9rem;
            margin-bottom: 20px;
        }
        .modal-stats {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 10px 20px;
            font-family: 'Roboto Mono', monospace;
            font-size: 0.9rem;
            color: #c0b0d0;
            margin-bottom: 20px;
        }
        .modal-stats .label {
            color: #7a6a8a;
        }
        .modal-stats .value {
            text-align: right;
            color: #eaeef7;
            font-weight: 500;
        }
        .modal-stats .value.highlight {
            color: #ffa94d;
        }
        .modal-steam {
            display: block;
            text-align: center;
            margin-top: 10px;
            padding: 10px 20px;
            background: rgba(100, 150, 255, 0.1);
            border-radius: 40px;
            border: 1px solid rgba(100, 150, 255, 0.2);
            color: #7aa8d0;
            text-decoration: none;
            transition: 0.3s;
            font-weight: 500;
        }
        .modal-steam:hover {
            background: rgba(100, 150, 255, 0.2);
            border-color: #7aa8d0;
            color: #fff;
        }

        .quote-block {
            background: rgba(16, 12, 30, 0.5);
            border-radius: 28px;
            padding: 30px;
            margin: 40px 0;
            text-align: center;
            border-left: 4px solid #ffa94d;
            font-style: italic;
            color: #c0b0d0;
            transition: all 0.3s;
        }
        .quote-block:hover {
            transform: translateY(-3px);
            box-shadow: 0 10px 25px rgba(0, 0, 0, 0.3);
        }
        footer {
            text-align: center;
            padding: 30px 0 40px;
            border-top: 1px solid rgba(255, 100, 100, 0.1);
            margin-top: 40px;
            color: #7a6a8a;
        }

        /* ── Адаптив ── */
        @media (max-width: 1200px) {
            .team-grid {
                grid-template-columns: repeat(4, 1fr);
            }
        }
        @media (max-width: 992px) {
            .team-grid {
                grid-template-columns: repeat(3, 1fr);
            }
        }
        @media (max-width: 768px) {
            .team-grid {
                grid-template-columns: repeat(2, 1fr);
            }
            .navbar {
                flex-direction: column;
                align-items: center;
            }
            .page-header h1 {
                font-size: 2.2rem;
            }
        }
        @media (max-width: 480px) {
            .team-grid {
                grid-template-columns: 1fr;
                gap: 18px;
            }
            .member-avatar {
                width: 80px;
                height: 80px;
            }
            .modal-box {
                padding: 20px;
            }
        }

        .fade-up {
            opacity: 0;
            transform: translateY(30px);
            animation: fadeUp 0.8s cubic-bezier(0.2, 0.9, 0.4, 1.1) forwards;
        }
        @keyframes fadeUp {
            to {
                opacity: 1;
                transform: translateY(0);
            }
        }
        .delay-1 {
            animation-delay: 0.1s;
        }
        .delay-2 {
            animation-delay: 0.2s;
        }
        .delay-3 {
            animation-delay: 0.3s;
        }
        .delay-4 {
            animation-delay: 0.4s;
        }
        .delay-5 {
            animation-delay: 0.5s;
        }
    </style>
</head>
<body>
    <div class="light-source-1"></div>
    <div class="light-source-2"></div>
    <div class="cursor-glow" id="cursorGlow"></div>

    <div class="container">
        <nav class="navbar fade-up">
            <div class="logo">✦ Phoenix</div>
            <div class="nav-links">
                <a href="/">Главная</a>
                <a href="/news">Новости</a>
                <a href="/phoenix" class="active">Phoenix</a>
                <a href="/unskillteam">Команда</a>
            </div>
        </nav>

        <div class="page-header fade-up">
            <h1>🔥 Phoenix Team</h1>
            <p>Состав команды по CS2 в стиле Faceit</p>
        </div>

        <!-- Сетка карточек -->
        <div class="team-grid" id="teamGrid">
            <!-- Карточки будут вставлены через JS -->
        </div>

        <div class="quote-block fade-up">
            <i class="fas fa-quote-left" style="margin-right: 10px; color:#ffa94d;"></i>
            Phoenix — это не просто команда, это братство. Мы играем ради победы и кайфа.
        </div>

        <footer>
            <p><i class="fab fa-telegram"></i> © 2026 — Phoenix Team · Все права защищены.</p>
        </footer>
    </div>

    <!-- Модальное окно -->
    <div class="modal-overlay" id="modalOverlay">
        <div class="modal-box">
            <span class="modal-close" id="modalClose">&times;</span>
            <div class="modal-avatar" id="modalAvatar"><img src="" alt="avatar" /></div>
            <div class="modal-name" id="modalName"></div>
            <div class="modal-role" id="modalRole"></div>
            <div class="modal-stats" id="modalStats"></div>
            <a href="#" class="modal-steam" id="modalSteam" target="_blank"><i class="fab fa-steam"></i> Профиль Steam</a>
        </div>
    </div>

    <script>
        // ── Данные игроков ──
        const players = [{
            id: 'mrsiktyyy',
            name: 'MrSiktyyy',
            tag: 'OpenFrager + Sniper',
            avatar: '/phx/Avatar_mrsiktyyyy.png',
            stats: {
                kd: '1.09',
                winrate: '49%',
                hs: '41%',
                adr: '73',
                s3: '—',
                s4: '4274 elo',
                s5: '4363 elo'
            },
            steam: 'https://steamcommunity.com/id/mrsiktyyy/'
        }, {
            id: 'novich0k42',
            name: 'Novich0k42',
            tag: 'Leader + Rifler',
            avatar: '/phx/Avatar_Novich0k42.png',
            stats: {
                kd: '1.20',
                winrate: '48%',
                hs: '54%',
                adr: '89',
                s3: '4301 elo',
                s4: '14830 elo',
                s5: '16992 elo'
            },
            steam: 'https://steamcommunity.com/profiles/76561199182259553'
        }, {
            id: 'zenlo',
            name: 'Zenlo.',
            tag: 'Sniper',
            avatar: '/phx/Avatar_Zenlo.png',
            stats: {
                kd: '0.95',
                winrate: '45%',
                hs: '42%',
                adr: '71',
                s3: '2027 elo',
                s4: '2560 elo',
                s5: '3373 elo'
            },
            steam: 'https://steamcommunity.com/id/zenlo-official'
        }, {
            id: 'fogy',
            name: 'Fogy',
            tag: 'Lurker',
            avatar: '/phx/Avatar_fogy.png', // если есть, иначе заглушка
            stats: {
                kd: '1.25',
                winrate: '48%',
                hs: '39%',
                adr: '78',
                s3: '2100 elo',
                s4: '2850 elo',
                s5: '3100 elo'
            },
            steam: '#'
        }, {
            id: 'vacancy',
            name: 'Ищем игрока',
            tag: 'Пятый · Любая роль',
            avatar: '',
            stats: null,
            steam: '#',
            isVacancy: true
        }];

        // ── Рендер карточек ──
        const grid = document.getElementById('teamGrid');
        grid.innerHTML = '';

        players.forEach((p, index) => {
            const card = document.createElement('div');
            card.className = `member-card fade-up delay-${index + 1}`;
            if (p.isVacancy) card.classList.add('vacancy');

            // Аватар
            const avatarDiv = document.createElement('div');
            avatarDiv.className = 'member-avatar';
            if (p.isVacancy) {
                avatarDiv.textContent = '+';
            } else {
                const img = document.createElement('img');
                img.src = p.avatar;
                img.alt = p.name;
                img.onerror = function() { this.style.display = 'none';
                    this.parentElement.textContent = p.name.charAt(0); };
                avatarDiv.appendChild(img);
            }

            // Имя
            const nameDiv = document.createElement('div');
            nameDiv.className = 'member-name';
            nameDiv.textContent = p.name;

            // Тег
            const roleDiv = document.createElement('div');
            roleDiv.className = 'member-role';
            roleDiv.textContent = p.tag;

            // Статистика (краткая)
            const statsDiv = document.createElement('div');
            statsDiv.className = 'member-stats';
            if (!p.isVacancy && p.stats) {
                statsDiv.innerHTML = `
                        <span>💀 ${p.stats.kd} K/D</span>
                        <span>🏆 ${p.stats.winrate}</span>
                    `;
            } else {
                statsDiv.innerHTML = `<span style="color:#7a6a8a;">Ждём тебя!</span>`;
            }

            // Действия
            const actionsDiv = document.createElement('div');
            actionsDiv.className = 'member-actions';

            if (p.isVacancy) {
                const btn = document.createElement('a');
                btn.className = 'btn-detail';
                btn.href = 'https://t.me/MrSikty';
                btn.target = '_blank';
                btn.innerHTML = '<i class="fab fa-telegram"></i> Написать';
                actionsDiv.appendChild(btn);
            } else {
                const detailBtn = document.createElement('button');
                detailBtn.className = 'btn-detail';
                detailBtn.innerHTML = '<i class="fas fa-info-circle"></i> Подробнее';
                detailBtn.dataset.id = p.id;
                detailBtn.addEventListener('click', (e) => {
                    e.stopPropagation();
                    openModal(p.id);
                });
                actionsDiv.appendChild(detailBtn);

                const steamBtn = document.createElement('a');
                steamBtn.className = 'btn-steam';
                steamBtn.href = p.steam;
                steamBtn.target = '_blank';
                steamBtn.innerHTML = '<i class="fab fa-steam"></i> Steam';
                actionsDiv.appendChild(steamBtn);
            }

            // Клик по карточке (кроме вакансии)
            if (!p.isVacancy) {
                card.addEventListener('click', () => openModal(p.id));
            }

            card.appendChild(avatarDiv);
            card.appendChild(nameDiv);
            card.appendChild(roleDiv);
            card.appendChild(statsDiv);
            card.appendChild(actionsDiv);
            grid.appendChild(card);
        });

        // ── Модальное окно ──
        const overlay = document.getElementById('modalOverlay');
        const closeBtn = document.getElementById('modalClose');
        const modalAvatar = document.getElementById('modalAvatar').querySelector('img');
        const modalName = document.getElementById('modalName');
        const modalRole = document.getElementById('modalRole');
        const modalStats = document.getElementById('modalStats');
        const modalSteam = document.getElementById('modalSteam');

        function openModal(id) {
            const player = players.find(p => p.id === id);
            if (!player || player.isVacancy) return;

            modalAvatar.src = player.avatar;
            modalAvatar.alt = player.name;
            modalName.textContent = player.name;
            modalRole.textContent = player.tag;

            const s = player.stats;
            modalStats.innerHTML = `
                    <span class="label">K/D</span><span class="value highlight">${s.kd}</span>
                    <span class="label">Win Rate</span><span class="value">${s.winrate}</span>
                    <span class="label">HS %</span><span class="value">${s.hs}</span>
                    <span class="label">ADR</span><span class="value">${s.adr}</span>
                    <span class="label">S3</span><span class="value">${s.s3}</span>
                    <span class="label">S4</span><span class="value">${s.s4}</span>
                    <span class="label">S5</span><span class="value">${s.s5}</span>
                `;

            modalSteam.href = player.steam;
            overlay.classList.add('active');
            document.body.style.overflow = 'hidden';
        }

        function closeModal() {
            overlay.classList.remove('active');
            document.body.style.overflow = '';
        }

        closeBtn.addEventListener('click', closeModal);
        overlay.addEventListener('click', (e) => {
            if (e.target === overlay) closeModal();
        });
        document.addEventListener('keydown', (e) => {
            if (e.key === 'Escape') closeModal();
        });

        // ── Курсор ──
        const glow = document.getElementById('cursorGlow');
        let mx = 0,
            my = 0,
            gx = 0,
            gy = 0;
        document.addEventListener('mousemove', (e) => { mx = e.clientX;
            my = e.clientY; });

        function animateGlow() {
            gx += (mx - gx) * 0.12;
            gy += (my - gy) * 0.12;
            glow.style.left = gx + 'px';
            glow.style.top = gy + 'px';
            requestAnimationFrame(animateGlow);
        }
        animateGlow();
    </script>
</body>
</html>
