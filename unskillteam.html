<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=yes" />
    <title>Discord Server | Phoenix Team</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Inter:opsz,wght@14..32,300;400;500;600;700;800&family=Roboto:wght@300;400;500;700;900&display=swap" rel="stylesheet" />
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0-beta3/css/all.min.css" />
    <link rel="icon" type="image/png" href="/favicon2.png" />
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        body {
            font-family: 'Roboto', sans-serif;
            background: #121212;
            color: #ffffff;
            line-height: 1.5;
            overflow-x: hidden;
            display: flex;
            flex-direction: column;
            min-height: 100vh;
        }
        body::-webkit-scrollbar {
            width: 0;
            background: transparent;
        }
        body {
            scrollbar-width: none;
        }

        .light-source {
            position: fixed;
            width: 600px;
            height: 600px;
            border-radius: 50%;
            pointer-events: none;
            z-index: 0;
            opacity: 0.08;
            filter: blur(80px);
            animation: floatLight 22s infinite alternate ease-in-out;
        }
        .light-source-1 {
            background: radial-gradient(circle, #FF5500, transparent);
            top: -10%;
            left: -10%;
        }
        .light-source-2 {
            background: radial-gradient(circle, #FF5500, transparent);
            bottom: -10%;
            right: -10%;
            animation-duration: 26s;
            animation-delay: -4s;
        }
        @keyframes floatLight {
            0% {
                transform: translate(0, 0) scale(1);
                opacity: 0.05;
            }
            100% {
                transform: translate(10%, 15%) scale(1.3);
                opacity: 0.12;
            }
        }

        .cursor-glow {
            position: fixed;
            width: 300px;
            height: 300px;
            background: radial-gradient(circle, rgba(255, 85, 0, 0.15), transparent 70%);
            border-radius: 50%;
            pointer-events: none;
            transform: translate(-50%, -50%);
            filter: blur(40px);
            z-index: 1000;
            transition: none;
        }

        .sidebar {
            position: fixed;
            top: 0;
            left: 0;
            width: 280px;
            height: 100vh;
            background: #1a1a1d;
            padding: 24px 16px;
            display: flex;
            flex-direction: column;
            gap: 20px;
            z-index: 100;
            border-right: 1px solid #2a2a2d;
            transition: transform 0.3s ease;
        }
        .sidebar .logo {
            font-size: 1.6rem;
            font-weight: 900;
            letter-spacing: -0.5px;
            background: linear-gradient(135deg, #FF5500, #ff8833);
            background-clip: text;
            -webkit-background-clip: text;
            color: transparent;
            padding: 8px 0 12px;
            border-bottom: 1px solid #2a2a2d;
            margin-bottom: 8px;
            text-decoration: none;
        }
        .sidebar nav ul {
            list-style: none;
            display: flex;
            flex-direction: column;
            gap: 4px;
        }
        .sidebar nav ul li a {
            display: flex;
            align-items: center;
            gap: 16px;
            padding: 12px 16px;
            border-radius: 8px;
            color: #aaaaaa;
            text-decoration: none;
            font-weight: 500;
            font-size: 0.95rem;
            transition: all 0.2s;
        }
        .sidebar nav ul li a i {
            width: 24px;
            text-align: center;
            font-size: 1.2rem;
        }
        .sidebar nav ul li a:hover {
            background: rgba(255, 255, 255, 0.05);
            color: #ffffff;
        }
        .sidebar nav ul li a.active {
            background: #FF5500;
            color: #ffffff;
            box-shadow: 0 4px 12px rgba(255, 85, 0, 0.3);
        }

        .main-wrapper {
            flex: 1;
            display: flex;
            flex-direction: column;
        }
        .main {
            margin-left: 280px;
            flex: 1;
            padding: 0 30px 20px;
            background: #121212;
            position: relative;
            z-index: 1;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
        }

        .top-bar {
            display: flex;
            align-items: center;
            justify-content: space-between;
            padding: 20px 0;
            border-bottom: 1px solid #2a2a2d;
            margin-bottom: 30px;
            flex-wrap: wrap;
            gap: 16px;
            width: 100%;
        }
        .top-bar .hamburger {
            display: none;
            font-size: 1.6rem;
            color: #aaaaaa;
            cursor: pointer;
            background: none;
            border: none;
            padding: 4px;
        }
        .top-bar .hamburger:hover {
            color: #ffffff;
        }
        .top-bar .page-title {
            font-size: 1.6rem;
            font-weight: 700;
            color: #ffffff;
        }
        .top-bar .page-title span {
            color: #FF5500;
        }
        .top-bar .right-actions {
            display: flex;
            align-items: center;
            gap: 16px;
        }
        .top-bar .right-actions a {
            display: flex;
            align-items: center;
            gap: 8px;
            padding: 8px 16px;
            border-radius: 40px;
            background: #2a2a2d;
            color: #aaaaaa;
            text-decoration: none;
            font-weight: 500;
            font-size: 0.9rem;
            transition: 0.2s;
        }
        .top-bar .right-actions a:hover {
            background: #FF5500;
            color: #ffffff;
        }
        .top-bar .right-actions a i {
            font-size: 1.1rem;
        }

        .discord-card {
            background: #1e1e1e;
            border-radius: 16px;
            padding: 40px 32px;
            max-width: 500px;
            width: 100%;
            text-align: center;
            border: 1px solid #2a2a2d;
            box-shadow: 0 8px 30px rgba(0, 0, 0, 0.4);
        }
        .discord-card .icon {
            font-size: 4rem;
            color: #5865f2;
            margin-bottom: 16px;
        }
        .discord-card h2 {
            font-size: 1.8rem;
            margin-bottom: 8px;
        }
        .discord-card p {
            color: #aaaaaa;
            margin-bottom: 24px;
            font-size: 1rem;
        }
        .discord-card .invite-btn {
            display: inline-flex;
            align-items: center;
            gap: 12px;
            padding: 14px 36px;
            background: #5865f2;
            border-radius: 40px;
            color: #ffffff;
            font-weight: 600;
            font-size: 1.1rem;
            text-decoration: none;
            transition: 0.2s;
            border: none;
            cursor: pointer;
        }
        .discord-card .invite-btn:hover {
            background: #4752c4;
            transform: translateY(-2px);
            box-shadow: 0 8px 20px rgba(88, 101, 242, 0.3);
        }
        .discord-card .invite-btn i {
            font-size: 1.4rem;
        }

        footer {
            text-align: center;
            padding: 20px 0 10px;
            border-top: 1px solid #2a2a2d;
            margin-top: 20px;
            color: #666666;
            font-size: 0.8rem;
            width: 100%;
            margin-left: 280px;
            background: #121212;
        }

        @media (max-width: 992px) {
            .sidebar {
                transform: translateX(-100%);
            }
            .sidebar.open {
                transform: translateX(0);
            }
            .main {
                margin-left: 0;
                padding: 0 20px 20px;
            }
            footer {
                margin-left: 0;
            }
            .top-bar .hamburger {
                display: block;
            }
            .discord-card {
                padding: 30px 20px;
            }
        }
        @media (max-width: 600px) {
            .discord-card h2 {
                font-size: 1.4rem;
            }
            .discord-card .invite-btn {
                padding: 12px 24px;
                font-size: 1rem;
            }
            .top-bar .right-actions a span {
                display: none;
            }
        }

        .fade-up {
            opacity: 0;
            transform: translateY(20px);
            animation: fadeUp 0.6s ease forwards;
        }
        @keyframes fadeUp {
            to {
                opacity: 1;
                transform: translateY(0);
            }
        }
        .delay-1 {
            animation-delay: 0.05s;
        }
    </style>
</head>
<body>
    <div class="light-source light-source-1"></div>
    <div class="light-source light-source-2"></div>
    <div class="cursor-glow" id="cursorGlow"></div>

    <aside class="sidebar" id="sidebar">
        <a href="/" class="logo">✦ Phoenix Team</a>
        <nav>
            <ul>
                <li><a href="/"><i class="fas fa-home"></i> Главная</a></li>
                <li><a href="/news"><i class="fas fa-newspaper"></i> Новости</a></li>
                <li><a href="/phoenix"><i class="fas fa-fire"></i> Phoenix</a></li>
                <li><a href="/unskillteam" class="active"><i class="fas fa-discord"></i> Discord Server</a></li>
            </ul>
        </nav>
    </aside>

    <div class="main-wrapper">
        <main class="main">
            <header class="top-bar">
                <button class="hamburger" id="hamburgerBtn" aria-label="Меню">
                    <i class="fas fa-bars"></i>
                </button>
                <div class="page-title">Discord <span>Server</span></div>
                <div class="right-actions">
                    <a href="/news"><i class="fas fa-newspaper"></i> <span>Новости</span></a>
                </div>
            </header>

            <div class="discord-card fade-up">
                <div class="icon"><i class="fab fa-discord"></i></div>
                <h2>Присоединяйся к нам!</h2>
                <p>Общайся с командой, следи за новостями и участвуй в жизни Phoenix Team.</p>
                <a href="https://discord.com/invite/kvd35a3Std" class="invite-btn" target="_blank">
                    <i class="fab fa-discord"></i> Присоединиться
                </a>
            </div>
        </main>

        <footer>
            <p>© 2026 — Phoenix Team · Все права защищены.</p>
        </footer>
    </div>

    <script>
        // ── Гамбургер ──
        const hamburger = document.getElementById('hamburgerBtn');
        const sidebar = document.getElementById('sidebar');
        hamburger.addEventListener('click', () => {
            sidebar.classList.toggle('open');
        });
        document.addEventListener('click', (e) => {
            if (window.innerWidth <= 992) {
                if (!sidebar.contains(e.target) && e.target !== hamburger && !hamburger.contains(e.target)) {
                    sidebar.classList.remove('open');
                }
            }
        });

        // ── Курсор ──
        const glow = document.getElementById('cursorGlow');
        let mx = 0,
            my = 0,
            gx = 0,
            gy = 0;
        document.addEventListener('mousemove', (e) => { mx = e.clientX;
            my = e.clientY; });

        function animateGlow() {
            gx += (mx - gx) * 0.12;
            gy += (my - gy) * 0.12;
            glow.style.left = gx + 'px';
            glow.style.top = gy + 'px';
            requestAnimationFrame(animateGlow);
        }
        animateGlow();
    </script>
</body>
</html>
